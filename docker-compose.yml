version: '3.8'\n\nservices:\n  frontend:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    ports:\n      - '8080:80'\n    depends_on:\n      - backend\n    volumes:\n      - ./nginx.conf:/etc/nginx/nginx.conf\n    networks:\n      - app-network\n\n  backend:\n    build:\n      context: ../BACKEND  # Предполагается, что бэкенд будет в соседней папке\n      dockerfile: Dockerfile\n    ports:\n      - '3000:3000'\n    environment:\n      - NODE_ENV=production\n      - DATABASE_URL=postgresql://user:password@db:5432/ozon_db\n    depends_on:\n      - db\n    networks:\n      - app-network\n\n  db:\n    image: postgres:15\n    ports:\n      - '5432:5432'\n    environment:\n      - POSTGRES_DB=ozon_db\n      - POSTGRES_USER=user\n      - POSTGRES_PASSWORD=password\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n    networks:\n      - app-network\n\nvolumes:\n  postgres_data:\n\nnetworks:\n  app-network:\n    driver: bridge
